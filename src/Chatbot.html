<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

  
    

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">


        function ChatMessage({message , sender}){
          //const message = props.message;
          //const sender = props.sender;
          //const{message, sender}=props;
          
         /*
         if (sender === 'Robot' ){
          return(
            <div>
              <img src="robot.png" width="30" />
              {message}               
            </div>
          );
         } 
          */

          return (
            <div>
              {sender === 'Robot' && 
                (<img src="robot.png" width="30" />)
              }
              {message}
              {sender === 'User' && 
              (<img src="user.png" width="30" />)
              }
              
            </div>
          );
        }

        function ChatInput({chatMessages, setChatMessages}) {

          const[inputText, setInputText] = React.useState('');  

          function saveInputText(event){            
            setInputText(event.target.value);
          }
          function sendMessage(){
            const newChatmessages = [
              ...chatMessages, // the (...) makes a copy of the current state of the chatMessages  array and then updates it with codes beneath
              {
                message: inputText,
                sender: 'user',
                id: crypto.randomUUID()
              }
            ];
            setChatMessages(newChatmessages);

            const response= Chatbot.getResponse(inputText);
            setChatMessages([
              ...newChatmessages,
              {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);
            setInputText('') // this one updates the input text to be empty 
          }
     
          return(
            <>
              <input 
                placeholder="send a message" 
                size="30" 
                onChange={saveInputText}
                value={inputText}
              />
              <button 
               onClick ={sendMessage}
              >Send</button>
              
            </>
          )
        }
        function ChatMessages({chatMessages}){
          // the values in the array brackets are the initial state values and the updater function for the state value

          
           
          
          return(
            <>
            
            {chatMessages.map((chatMessage) => {
                return(
                  <ChatMessage 
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                  />
                  );
                  }
                )
              }  
             </>
            ) 
        }
        function App(){
            const [chatMessages , setChatMessages] = React.useState(
            [{

            message: 'Hello Chatbot',
            sender: 'User',
            id: 'id1'
          },{
            message: 'Hello! how can i help you',
            sender : 'Robot',
            id: 'id2'
          },{
            message:  'Can you get me today\'s date ',
            sender : 'User',
            id: 'id3'
          },
            {
            message:  'Sure! Todays date is 2026/11/08 ',
            sender : 'Robot',
            id: 'id4'
          }
          ]
                
          );
          //const[chatMessages , setChatMessages] =array;// array destructuring : shortcut to get the current state value and the updater function from the array returned by React.useState()
          //const chatMessages = array[0]; //current state value
          //const setChatMessages = array[1]; // updater function : this is used to update the state value
       
       
          return(
            <>
             <ChatInput 
             chatMessages={chatMessages}
             setChatMessages={setChatMessages}
             />
             <ChatMessages 
              chatMessages={chatMessages}
             />
                        
           </>
          );
        }
          
        
        
    
      const container = document.querySelector('.js-container');
      
        ReactDOM.createRoot(container).render(<App />);
      </script> 
  </body>
</html>
